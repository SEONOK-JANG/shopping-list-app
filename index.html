<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쇼핑 리스트</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #inputRow { display: flex; gap: 8px; margin-bottom: 16px; }
  #itemInput { flex: 1; padding: 8px; font-size: 16px; }
  #addBtn { padding: 8px 16px; font-size: 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
  li span { flex: 1; cursor: pointer; }
  li.checked span { text-decoration: line-through; color: #999; }
  li button { background: none; border: none; color: #c00; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<h1>쇼핑 리스트</h1>
<div id="inputRow">
  <input id="itemInput" placeholder="살 것 입력" />
  <button id="addBtn">추가</button>
</div>
<ul id="list"></ul>

<script>
const STORAGE_KEY = "shopping-list-items";

function loadItems() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveItems(items) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function addItem(items, text) {
  const trimmed = text.trim();
  if (!trimmed) return items;
  return [...items, { text: trimmed, checked: false }];
}

function toggleItem(items, index) {
  return items.map((item, i) => i === index ? { ...item, checked: !item.checked } : item);
}

function deleteItem(items, index) {
  return items.filter((_, i) => i !== index);
}

let items = loadItems();

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach((item, i) => {
    const li = document.createElement("li");
    if (item.checked) li.classList.add("checked");

    const span = document.createElement("span");
    span.textContent = item.text;
    span.onclick = () => { items = toggleItem(items, i); saveItems(items); render(); };

    const delBtn = document.createElement("button");
    delBtn.textContent = "×";
    delBtn.onclick = () => { items = deleteItem(items, i); saveItems(items); render(); };

    li.appendChild(span);
    li.appendChild(delBtn);
    list.appendChild(li);
  });
}

function handleAdd() {
  const input = document.getElementById("itemInput");
  items = addItem(items, input.value);
  saveItems(items);
  input.value = "";
  render();
}

document.getElementById("addBtn").onclick = handleAdd;
document.getElementById("itemInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleAdd();
});

render();

// self-check: run `runSelfTest()` in console
window.runSelfTest = function () {
  let t = [];
  t = addItem(t, "milk");
  console.assert(t.length === 1 && t[0].text === "milk" && !t[0].checked, "add failed");
  t = addItem(t, "  ");
  console.assert(t.length === 1, "blank add should be ignored");
  t = toggleItem(t, 0);
  console.assert(t[0].checked === true, "toggle failed");
  t = deleteItem(t, 0);
  console.assert(t.length === 0, "delete failed");
  console.log("runSelfTest: all checks passed");
};
</script>
</body>
</html>
